<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>免费名师课堂｜软考中项</title><style>body{font-family:system-ui;background:#f3f6fb;color:#172033;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #dbe2ee}a.btn{display:inline-block;background:#1769d1;color:white;padding:10px 14px;border-radius:9px;text-decoration:none;margin:5px 6px 5px 0}small,p{line-height:1.7;color:#536176}.tag{background:#e8f3eb;padding:3px 7px;border-radius:7px}input{width:95%;padding:12px;border:1px solid #cdd5e2;border-radius:8px;font-size:16px}</style></head><body><main><a href="./">← 返回刷题首页</a><h1>🎓 免费名师课堂</h1><p>已根据实际使用反馈下架4个无法打开的视频直链。仅保留反馈可打开的入口，其余改为B站站内搜索。暂不提供未经核实的时间戳。</p><input id="search" placeholder="搜索：挣值、进度、案例、风险、信息化……" oninput="render()"><div id="list"></div></main><script>
const videos=[
{t:'挣值分析 / CPI / SPI',n:'挣值分析专题（你已反馈可打开）',url:'https://www.bilibili.com/list/ml923041849',note:'已收到用户反馈：该入口可打开。是否所有选集免费仍以平台实际显示为准。',keys:'挣值 CPI SPI EV PV AC 成本 偏差'}
];
const searches=[
{t:'关键路径 / 网络图',q:'系统集成项目管理工程师 第三版 关键路径 计算 免费讲解'},
{t:'案例分析',q:'系统集成项目管理工程师 第三版 案例分析 免费课程'},
{t:'第三版系统精讲',q:'系统集成项目管理工程师 第三版 免费精讲'}
];
function searchCards(q){return searches.filter(x=>(x.t+x.q).toLowerCase().includes(q)).map(x=>'<div class="card"><span class="tag">待筛选</span><h3>'+x.t+'</h3><p>原推荐视频无法正常访问，暂不再提供失效直链。下面打开B站官方搜索结果，自行选择免费可观看的视频。</p><a class="btn" target="_blank" rel="noopener noreferrer" href="https://search.bilibili.com/all?keyword='+encodeURIComponent(x.q)+'">在B站搜索 ↗</a></div>').join('')}
function render(){let q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('list').innerHTML=videos.filter(v=>(v.t+v.n+v.keys).toLowerCase().includes(q)).map(v=>'<div class="card"><span class="tag">'+v.t+'</span><h3>'+v.n+'</h3><p>'+v.note+'</p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+v.url+'">在B站打开公开课 ↗</a></div>').join('')+searchCards(q)||'<p>暂无匹配资源，请使用题目文字解析。</p>'}render();
</script></body></html>
