 ,{t:'关键路径 / 网络图',n:'野人老师·第三版课程及进度计算专题',url:'https://www.bilibili.com/video/BV1hK411A7KC/',note:'B站页面可检索到“工期压缩和画双代号网络图”“进度类计算题-案例分析”选集；手机端可用性待你确认。',keys:'关键路径 进度 网络图 时差 PERT'},

];
