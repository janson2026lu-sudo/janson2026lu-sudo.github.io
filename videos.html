const videos=[
{t:'挣值分析 / CPI / SPI',n:'系统集成挣值分析专题（公开视频选集）',url:'https://www.bilibili.com/list/ml923041849',note:'该公开列表包含挣值分析专题训练营；需在B站选集里选择对应课时。',keys:'挣值 CPI SPI EV PV AC 成本 偏差'},
{t:'项目进度 / 关键路径',n:'野人老师·项目进度管理（部分第二版参考课）',url:'https://www.bilibili.com/video/BV1Gf421d799/',note:'有进度管理选集，但其中部分内容标注第二版参考；请结合第三版教材核对。',keys:'关键路径 进度 网络图 时差 PERT'},
{t:'案例分析 / 计算题',n:'江山老师·第三版教材公开视频',url:'https://www.bilibili.com/video/BV1y5411z7B1/',note:'公开课选集；完整案例和计算专题可能收费，不保证全部免费。',keys:'案例 计算 成本 进度'},

{t:'第三版系统精讲',n:'蜗牛老师·2026第三版课程',url:'https://www.bilibili.com/video/BV124421D7vG/',note:'公开选集含多章课程，部分其他内容可能另行收费。',keys:'项目管理 范围 进度 成本 风险 采购 质量'}
];
function render(){let q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('list').innerHTML=videos.filter(v=>(v.t+v.n+v.keys).toLowerCase().includes(q)).map(v=>'<div class="card"><span class="tag">'+v.t+'</span><h3>'+v.n+'</h3><p>'+v.note+'</p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+v.url+'">在B站打开公开课 ↗</a></div>').join('')||'<p>暂未找到对应视频。请先使用题目文字解析，后续补充经核验的专题。</p>'}render();
