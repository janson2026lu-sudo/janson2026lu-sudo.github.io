<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历年真题建设进度</title><style>body{font:16px system-ui;background:#f4f7fc;color:#1d2939;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #dce3ee}a{color:#1765b5}a.btn{display:inline-block;padding:10px 12px;border-radius:8px;background:#1765b5;color:white;text-decoration:none}p{line-height:1.65}.tag{background:#eef4ff;padding:3px 8px;border-radius:7px;font-size:13px}small{color:#667085}input{padding:12px;width:94%;font-size:16px;border:1px solid #cbd5e1;border-radius:8px}</style></head><body><main><a href="./">← 返回刷题网站</a><h1>📜 历年真题建设进度</h1><div class="card"><b>真实进度</b><p>已完成：来源盘点、按年份/批次整理、独立入口。<br>尚未完成：获得整套试卷转载许可、逐题核对及完整站内导入。</p><p><strong>说明：</strong>信管网题库有回忆版和会员内容；公开可浏览不代表允许整库复制。这里不将模拟题冒充真题，也不展示未经授权复制的题干和解析。</p></div><input id="filter" placeholder="搜索年份、科目、批次" oninput="render()"><div id="items"></div><div class="card"><b>合法导入标准</b><p>取得明确使用许可或合法可再利用的题源后，核对题目、答案、批次与来源，再导入站内练习、考试和错题功能；现有学习记录保持不变。</p><a class="btn" href="https://www.cnitpm.com/exam/2_1.html" target="_blank" rel="noopener noreferrer">查看信管网公开目录</a></div></main><script>
const groups=[['2026上半年','综合知识','第1—2批，回忆版'],['2026上半年','案例分析','第1—2批，回忆版'],['2025下半年','综合知识','第1—4批，回忆版'],['2025下半年','案例分析','第1—4批，回忆版'],['2024下半年','综合知识','第1—5批，部分未核实'],['2024下半年','案例分析','第1—5批，部分未核实'],['2023下半年','综合知识','第1—6批，回忆版'],['2023下半年','案例分析','第1—6批，回忆版'],['2023上半年','综合知识 / 案例分析','历史试卷'],['2022上下半年','综合知识 / 案例分析','全国卷、广东卷需分别核对'],['2021下半年','综合知识 / 案例分析','全国卷需核对']];
function render(){let q=document.getElementById('filter').value.trim();document.getElementById('items').innerHTML=groups.filter(x=>x.join(' ').includes(q)).map(x=>'<div class="card"><span class="tag">待授权及逐题核对</span><h3>'+x[0]+' · '+x[1]+'</h3><p>'+x[2]+'</p><small>来源目录已找到，暂未导入整卷。</small></div>').join('')||'<p>没有匹配的试卷。</p>'}render();
</script></body></html>
